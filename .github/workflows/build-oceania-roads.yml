# 호주·뉴질랜드 도시별 길 칸 목록(길 탐험률 분모)을 만들어 나라별 Release에 더한다.
# 도시 경계는 같은 Release의 <나라>.cities.geojson.gz 를 쓴다 (build-oceania 다음에).
name: build-oceania-roads

on:
  workflow_dispatch:
  workflow_run:
    workflows: [build-oceania]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: AU
            tag: au-v1
            pbf: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
          - code: NZ
            tag: nz-v1
            pbf: https://download.geofabrik.de/australia-oceania/new-zealand-latest.osm.pbf
    steps:
      - uses: actions/checkout@v5

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet shapely h3 numpy

      - name: 자료 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSL -o src.osm.pbf ${{ matrix.pbf }}
          gh release download ${{ matrix.tag }} -p ${{ matrix.code }}.cities.geojson.gz --clobber

      - name: 길·철도 뽑기
        run: |
          osmium tags-filter src.osm.pbf w/highway w/railway -o roads.osm.pbf --overwrite
          osmium export roads.osm.pbf --geometry-types=linestring -f geojsonseq -o roads.geojsonseq --overwrite

      - name: 도시별 길 칸 만들기
        run: |
          set -o pipefail
          mkdir -p out
          python scripts/build_roads.py roads.geojsonseq ${{ matrix.code }}.cities.geojson.gz out 2>&1 | tee roads.log.txt
          echo "::notice title=${{ matrix.code }} roads::$(tail -n 1 roads.log.txt)"
          du -sh out; ls out | wc -l

      - name: 기록 올리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp roads.log.txt ${{ matrix.code }}.roads.log.txt 2>/dev/null || echo "no log" > ${{ matrix.code }}.roads.log.txt
          tail -c 20000 ${{ matrix.code }}.roads.log.txt > t && mv t ${{ matrix.code }}.roads.log.txt
          gh release upload ${{ matrix.tag }} ${{ matrix.code }}.roads.log.txt --clobber

      - name: Release 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ matrix.tag }} out/* --clobber
