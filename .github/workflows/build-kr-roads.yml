# 한국 도시별 길 칸 목록(길 탐험률 분모)을 만들어 Release(kr-v2)에 더한다.
# 도시 경계는 같은 Release의 KR.cities.geojson.gz 를 쓴다.
name: build-kr-roads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_roads.py'
      - '.github/workflows/build-kr-roads.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet shapely h3 numpy

      - name: 자료 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSL -o kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          gh release download kr-v2 -p KR.cities.geojson.gz --clobber

      - name: 길·철도 뽑기
        run: |
          osmium tags-filter kr.osm.pbf w/highway w/railway -o roads.osm.pbf --overwrite
          osmium export roads.osm.pbf --geometry-types=linestring \
            -f geojsonseq -o roads.geojsonseq --overwrite

      - name: 도시별 길 칸 만들기
        run: |
          mkdir -p out
          python scripts/build_roads.py roads.geojsonseq KR.cities.geojson.gz out | tee log.txt
          echo "::notice title=roads::$(tail -n 1 log.txt)"
          du -sh out; ls out | wc -l

      - name: Release 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload kr-v2 out/* --clobber
